name: Container image

# Builds the Docker image on every PR, scans it for vulnerabilities, and on
# main / version tags publishes it to GitHub Container Registry. An optional
# deploy hook (e.g. Render, Railway, Coolify) runs after a successful publish.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build, scan & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: softex:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name softex -p 4000:4000 softex:scan
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/api/health && break; sleep 2; done
          curl -fsS http://localhost:4000/api/health
          docker rm -f softex
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: softex:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload scan results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        # Code scanning is not available on every repository plan; the blocking check is the next step.
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: softex:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy
    needs: image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "No DEPLOY_HOOK_URL secret configured; the image is published and ready to deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" -H 'Content-Type: application/json' -d "{\"image\":\"${{ env.IMAGE }}@${DIGEST}\"}"

  # Google Cloud Run. Inert until the repository variable GCP_PROJECT_ID is set (see docs/DEPLOY_CLOUD_RUN.md).
  # Authenticates with Workload Identity Federation (no stored keys), copies the exact image that was
  # scanned and attested into Artifact Registry, and deploys it by digest.
  deploy-cloud-run:
    name: Deploy to Cloud Run
    needs: image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'kuu' }}
      AR_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/kuu/kuu
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/setup-buildx-action@v4
      - name: Log in to registries
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Copy the image to Artifact Registry
        run: docker buildx imagetools create --tag "${AR_IMAGE}:${GITHUB_SHA::7}" "${{ env.IMAGE }}@${{ needs.image.outputs.digest }}"
      - name: Deploy the new revision
        run: |
          gcloud run deploy "$SERVICE" --region "$REGION" --image "${AR_IMAGE}@${{ needs.image.outputs.digest }}" --quiet
